name: Feature request
description: A check, a scenario or an output the tool does not have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to find out or prevent, and where the tool fell short.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: A case where it matters
      description: A real incident, chart, repository or upstream issue that shows the problem. A case where the check must stay quiet helps too.
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
